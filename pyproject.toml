[project]
name = "review-sentiment-service"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
transformer = ["transformers>=4.45", "torch>=2.4"]
explain = ["lime>=0.2.0.1"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
